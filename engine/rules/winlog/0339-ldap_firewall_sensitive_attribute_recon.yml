title: LDAP Firewall Audited Sensitive Attribute Access
id: winlog-0339
status: experimental
rule_origin: internal
description: Detects the LDAP Firewall auditing an LDAP query touching attributes commonly abused for recon or credential
  theft - admincount and servicePrincipalName (BloodHound / Kerberoasting), ms-Mcs-AdmPwd (LAPS) and msDS-KeyCredentialLink
  (Shadow Credentials). The LDAP Firewall must be configured to audit these attributes for the event to appear.
references:
- https://github.com/zeronetworks/ldapfw
- https://attack.mitre.org/techniques/T1087/
- https://attack.mitre.org/techniques/T1558/003/
author: ADA default rules
date: 2026/10/22
modified: 2026/10/22
tags:
- TA0007
- attack.t1087
- attack.discovery
logsource: winlog
detection:
  selection:
    Channel: LDAPFW
  sensitive_attr:
    # LDAP attribute names are case-insensitive and rendered as the client sent them;
    # the engine's contains matching is case-sensitive, so match with a regex.
    Message|re: (?i)(admincount|ms-mcs-admpwd|msds-keycredentiallink|serviceprincipalname)
  condition: selection and sensitive_attr
fields:
- Hostname
- Message
unique_fields:
- Hostname
level: medium
falsepositives:
- Legitimate administrative tooling or directory synchronisation reading these attributes.
