version: v2
# Invoked by `make gen_proto` once per module with `-o <module dir>` so that
# the generated files land next to their .proto source.
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
